utname: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read      # com.nijatva:signature comes from GitHub Packages

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform
        run: |
          # The runner image already ships the Android SDK; the setup-android
          # action tries to install the retired "tools" package and fails, so
          # call sdkmanager directly for the two packages we actually need.
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "android platform 35 ready"

      - name: Is a signing key configured?
        id: key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore keystore
        if: steps.key.outputs.present == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > nijatva-release.keystore

      - name: Build signed release APK
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (no signing key in secrets)
        if: steps.key.outputs.present != 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nijatva-editor-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
